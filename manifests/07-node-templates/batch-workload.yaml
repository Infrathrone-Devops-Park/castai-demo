# Module 07: selects one label only.
# Needs partial template matching.
apiVersion: v1
kind: Namespace
metadata:
  name: castai-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: castai-lab
  labels: { app: batch }
spec:
  replicas: 2
  selector: { matchLabels: { app: batch } }
  template:
    metadata:
      labels: { app: batch }
    spec:
      terminationGracePeriodSeconds: 5
      # template has workload + team
      nodeSelector:
        workload: batch
      tolerations:
        - key: workload
          operator: Equal
          value: batch
          effect: NoSchedule
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 500m, memory: 128Mi }
            limits: { memory: 128Mi }
